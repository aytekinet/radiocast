    <!-- Safe Service Worker and cache maintenance without unhandled rejections -->
    <script>
      (function() {
        try {
          if (typeof window !== 'undefined' && 'serviceWorker' in navigator && window.location.protocol === 'https:') {
            navigator.serviceWorker.getRegistrations()
              .then(function(registrations) {
                if (registrations && registrations.length) {
                  for (var i = 0; i < registrations.length; i++) {
                    registrations[i].unregister().catch(function() {});
                  }
                }
              })
              .catch(function() {});
          }
        } catch (e) {}

        try {
          if (typeof window !== 'undefined' && 'caches' in window) {
            caches.keys()
              .then(function(keys) {
                if (keys && keys.length) {
                  for (var i = 0; i < keys.length; i++) {
                    caches.delete(keys[i]).catch(function() {});
                  }
                }
              })
              .catch(function() {});
          }
        } catch (e) {}
      })();
    </script>
